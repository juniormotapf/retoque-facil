name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pacotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar manifesto
        run: npx -y @anthropic-ai/mcpb validate manifest.json
      - name: Gerar pacotes
        run: uv run --no-project --python 3.12 python scripts/empacotar.py
      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
